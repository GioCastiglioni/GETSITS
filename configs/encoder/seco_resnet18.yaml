_target_:  getsits.encoders.resnet18.ResNet18
encoder_weights: ./pretrained_models/seco_resnet18_1m.pt
download_url: null
input_size: ${dataset.img_size}
multi_temporal: False
topology: [64, 128, 256, 512]
